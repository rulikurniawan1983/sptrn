name: Deploy to Laravel Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Laravel Cloud deployment
        run: |
          curl -X POST "${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"branch":"main"}'
